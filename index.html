<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <title>Qirsh</title>
    <meta name="description" content="Track spending in dollars and lira." />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" type="image/png" href="icons/favicon.png" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <meta name="theme-color" content="#F3F6F4" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0E1311" media="(prefers-color-scheme: dark)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Qirsh" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="preload" href="fonts/geist-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="fonts/geist-mono-latin.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body>
    <header class="top">
      <div class="wrap">
        <h1 class="brand"><span class="coin" aria-hidden="true"></span>Qirsh</h1>
        <span class="top-sub" id="topSub"></span>
      </div>
    </header>

    <main>
      <div class="wrap">
        <div id="alerts" hidden></div>
        <section class="view" id="v-home"></section>
        <section class="view" id="v-history" hidden></section>
        <section class="view" id="v-budgets" hidden></section>
        <section class="view" id="v-settings" hidden></section>
      </div>
    </main>

    <button class="fab" id="fab" data-act="new" aria-label="Add transaction">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
        <path d="M12 5v14M5 12h14" />
      </svg>
    </button>

    <nav class="tabs" aria-label="Sections">
      <div class="wrap">
        <button data-act="nav" data-v="home" aria-current="page">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linejoin="round"
          >
            <path d="M4 10.5 12 4l8 6.5V20h-5.5v-5h-5v5H4z" /></svg
          >Home
        </button>
        <button data-act="nav" data-v="history">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
          >
            <path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01" /></svg
          >History
        </button>
        <button data-act="nav" data-v="budgets">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <circle cx="12" cy="12" r="8" />
            <path d="M12 4v8l5.7 5.7" /></svg
          >Budgets
        </button>
        <button data-act="nav" data-v="settings">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
          >
            <path d="M4 7h10M18 7h2M4 17h4M12 17h8" />
            <circle cx="16" cy="7" r="2" />
            <circle cx="10" cy="17" r="2" /></svg
          >Settings
        </button>
      </div>
    </nav>

    <div class="scrim" id="scrim" data-act="close" hidden></div>
    <div class="sheet" id="sheet" role="dialog" aria-modal="true" hidden></div>
    <div class="toast" id="toast" role="status" hidden></div>
    <input type="file" id="importFile" accept="application/json,.json" hidden />

    <script type="module" src="js/main.js"></script>
  </body>
</html>
