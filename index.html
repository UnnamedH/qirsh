<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Qirsh</title>
<style>:root{color-scheme:light}body{margin:0;padding:0}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: one narrow column (max 520px); sticky header, fixed bottom tab bar + add button; entry happens in bottom sheets */
:root{
  --bg:#F3F6F4; --surface:#FFFFFF; --fg:#14201B; --muted:#5B6964; --line:#DCE3E0;
  --accent:#1D6A50; --accent-ink:#FFFFFF; --accent-soft:#E0EEE8;
  --warn:#A86D12; --bad:#B23F37; --bad-soft:#F7E3E1;
  --scrim:rgba(10,20,16,.38);
  --f-body:"Geist",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-num:"Geist Mono",ui-monospace,"SF Mono","Roboto Mono",Menlo,monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1311; --surface:#161D1A; --fg:#E5EDE9; --muted:#8FA099; --line:#25302B;
  --accent:#55B892; --accent-ink:#06140F; --accent-soft:#16332A;
  --warn:#E2A94B; --bad:#E57F76; --bad-soft:#3A1F1C; --scrim:rgba(0,0,0,.55); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0E1311; --surface:#161D1A; --fg:#E5EDE9; --muted:#8FA099; --line:#25302B;
  --accent:#55B892; --accent-ink:#06140F; --accent-soft:#16332A;
  --warn:#E2A94B; --bad:#E57F76; --bad-soft:#3A1F1C; --scrim:rgba(0,0,0,.55); color-scheme:dark }

*{box-sizing:border-box}
html,body{min-height:100%}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.wrap{max-width:520px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.num,.amt{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.label{font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:0}
.muted{color:var(--muted)}
h2{font-size:17px;margin:0;font-weight:600;letter-spacing:-.01em;text-wrap:balance}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px 10px}
.brand{display:flex;align-items:center;gap:8px;margin:0;font-size:19px;font-weight:700;letter-spacing:-.02em}
.coin{width:20px;height:20px;border-radius:50%;border:3px solid var(--accent);position:relative;flex:none}
.coin::after{content:"";position:absolute;width:3px;height:7px;background:var(--accent);right:-5px;bottom:-5px;transform:rotate(-45deg);border-radius:2px}
.top-sub{font-size:13px;color:var(--muted)}

main .wrap{padding-block:6px calc(130px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:26px}
.view{display:flex;flex-direction:column;gap:26px}
.sec{display:flex;flex-direction:column;gap:10px}
.sec-head{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:30px}

/* banner */
.banner{display:flex;gap:12px;align-items:center;justify-content:space-between;background:var(--accent-soft);border-radius:var(--r);padding:12px 14px;font-size:14px}
.banner p{margin:0}

/* balance */
.balance{display:flex;flex-direction:column;gap:6px}
.balance-total{background:none;border:0;padding:0;text-align:left;font-family:var(--f-num);font-variant-numeric:tabular-nums;font-size:38px;font-weight:600;letter-spacing:-.03em;line-height:1.1}
.balance-total small{font-size:15px;font-weight:500;color:var(--muted);letter-spacing:0;margin-left:6px}
.balance-split{display:flex;flex-wrap:wrap;gap:6px 18px;font-family:var(--f-num);font-variant-numeric:tabular-nums;font-size:15px}
.balance-split span{display:flex;gap:6px;align-items:baseline}
.balance-split em{font-style:normal;font-family:var(--f-body);font-size:12px;color:var(--muted)}
.accounts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.acc{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:2px;text-align:left;min-width:0}
.acc .amt{font-size:15px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acc .amt.sub{font-size:13px;color:var(--muted);font-weight:400}
.acc-name{display:flex;justify-content:space-between;align-items:center;gap:6px}
.acc-name .move{font-size:12.5px;color:var(--accent);font-weight:600}

/* segmented */
.seg{display:inline-flex;background:var(--line);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:6px 12px;border-radius:8px;font-size:13.5px;font-weight:500;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.seg.wide{display:flex}
.seg.wide button{flex:1}

/* lists */
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:11px 14px;border-top:1px solid var(--line);min-width:0}
.row:first-child{border-top:0}
button.row,.row>button.row-btn{width:100%;background:none;border:0;border-top:1px solid var(--line);text-align:left;color:inherit}
button.row:first-child{border-top:0}
.row>button.row-btn{border:0;padding:0;display:flex;align-items:center;gap:12px;flex:1;min-width:0}
.glyph{width:34px;height:34px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:650;font-size:14px;flex:none}
.glyph.tr{background:var(--line);color:var(--muted)}
.glyph.in{background:var(--accent);color:var(--accent-ink)}
.row-main{flex:1;min-width:0;display:flex;flex-direction:column}
.row-title{font-weight:550;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-sub{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.amt{white-space:nowrap;text-align:right}
.amt.in{color:var(--accent)}
.amt.tr{color:var(--muted)}
.count{font-size:12px;color:var(--muted);font-family:var(--f-num)}
.icon-btn{border:0;background:none;width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:var(--muted);flex:none}
.icon-btn:hover{background:var(--line)}
.icon-btn svg{width:18px;height:18px}
.empty{padding:22px 16px;text-align:center;color:var(--muted);font-size:14px;margin:0}
.day-head{display:flex;justify-content:space-between;padding:14px 2px 6px;font-size:13px;color:var(--muted);font-weight:500}

/* stats */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{display:flex;flex-direction:column;gap:2px;min-width:0}
.stat .amt{text-align:left;font-size:16px;font-weight:550;overflow:hidden;text-overflow:ellipsis}

/* budgets */
.budget{display:flex;flex-direction:column;gap:7px;padding:13px 14px;border-top:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left}
.budget:first-child{border-top:0}
.b-top{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.b-name{font-weight:550;display:flex;gap:8px;align-items:baseline;min-width:0}
.b-name span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill{font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:1px 7px;flex:none}
.pill.warn{color:var(--warn);border-color:currentColor}
.pill.over{color:var(--bad);border-color:currentColor}
.b-nums{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-size:13.5px;white-space:nowrap}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:3px;max-width:100%}
.bar.warn>i{background:var(--warn)}
.bar.over>i{background:var(--bad)}
.b-foot{font-size:12.5px;color:var(--muted);display:flex;justify-content:space-between;gap:10px}

/* month switch */
.month-switch{display:flex;align-items:center;justify-content:space-between;gap:8px}
.month-switch strong{font-size:17px;font-weight:600}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.search{flex:1;min-width:140px}

/* buttons, fields */
.btn{border:1px solid var(--line);background:var(--surface);padding:10px 16px;border-radius:11px;font-weight:550;font-size:14.5px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:none}
.btn.danger{color:var(--bad);border-color:var(--bad-soft)}
.btn.danger.armed{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.sm{padding:6px 12px;font-size:13.5px;border-radius:9px}
.link{border:0;background:none;color:var(--accent);font-weight:600;font-size:14px;padding:4px 0}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field>span{font-size:12.5px;color:var(--muted);font-weight:500}
.input,.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;font-size:16px;min-width:0}
.field textarea{font-family:var(--f-num);font-size:16px;min-height:120px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:12px}
.card p{margin:0}
.set-row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.set-row .field{flex:1}
.cat-row{display:flex;gap:8px;align-items:center}
.cat-row input{flex:1}
.cat-row input.emoji{flex:0 0 44px;width:44px;text-align:center;padding:9px 0;font-size:18px}
.cat-row .icon-btn{width:32px}
.icon-btn:disabled{opacity:.3;cursor:default}
.icon-btn.armed{color:var(--bad)}
.amt.has-chg{display:inline-flex;flex-direction:column;align-items:flex-end;line-height:1.25}
.amt .chg{font-size:12px;color:var(--muted)}
.cur-tag{flex:none;width:52px;text-align:center;font-family:var(--f-num);font-size:13px;color:var(--muted);border:1px solid var(--line);border-radius:9px;padding:7px 0}
.k000.ghost{visibility:hidden}
.links{display:flex;flex-wrap:wrap;gap:4px 18px;margin-top:-10px}
.lines{display:flex;flex-direction:column;gap:6px}
.sub-lines{display:flex;flex-direction:column;gap:2px}
.moves{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.moves .btn{display:inline-flex;align-items:center;gap:6px}
.moves .btn b{font-family:var(--f-num);font-weight:600;color:var(--accent)}
.rate-in{display:flex;align-items:center;gap:6px}
.rate-in input{flex:1;min-width:0}
.rate-in span{font-size:13px;color:var(--muted);flex:none}
.chip.sm{font-size:13px;padding:6px 11px;align-self:flex-start}
.sub-label{font-size:12.5px;color:var(--muted);font-weight:500}
.note{font-size:13px;color:var(--muted);margin:0}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}

/* add button + nav */
.fab{position:fixed;z-index:25;bottom:calc(76px + env(safe-area-inset-bottom,0px));right:max(calc(16px + env(safe-area-inset-right,0px)),calc((100vw - 520px)/2 + 16px));width:58px;height:58px;border-radius:18px;border:0;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;box-shadow:0 6px 18px rgba(20,60,45,.28)}
.fab svg{width:26px;height:26px}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:24;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs .wrap{display:grid;grid-template-columns:repeat(4,1fr)}
.tabs button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 10px;font-size:11.5px;font-weight:500;color:var(--muted)}
.tabs button svg{width:22px;height:22px}
.tabs button[aria-current="page"]{color:var(--accent)}

/* sheet */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:40}
.sheet{position:fixed;z-index:41;left:50%;bottom:0;transform:translateX(-50%);width:100%;max-width:520px;max-height:90vh;overflow:auto;background:var(--bg);border-radius:20px 20px 0 0;padding:8px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px;animation:up .18s ease-out}
@keyframes up{from{transform:translate(-50%,24px);opacity:.6}to{transform:translate(-50%,0);opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.grab{width:38px;height:4px;border-radius:2px;background:var(--line);margin:2px auto 0}
.sheet-head{display:flex;justify-content:space-between;align-items:center}
.amount-row{display:flex;gap:8px;align-items:center}
.amount-input{flex:1;min-width:0;font-family:var(--f-num);font-size:30px;font-weight:600;border:0;border-bottom:2px solid var(--line);background:none;padding:6px 2px;border-radius:0;letter-spacing:-.02em}
.amount-input:focus{outline:none;border-color:var(--accent)}
.amount-input.sm{font-size:20px}
.k000{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:7px 9px;font-family:var(--f-num);font-size:13px}
.hint{margin:-6px 0 0;font-size:13px;color:var(--muted);min-height:18px;font-family:var(--f-num)}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-size:14px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.form-error{margin:0;color:var(--bad);font-size:13.5px}
.sheet-actions{display:flex;gap:10px;justify-content:flex-end}
.sheet-actions .primary{flex:1}

/* toast */
.toast{position:fixed;z-index:50;left:50%;transform:translateX(-50%);bottom:calc(146px + env(safe-area-inset-bottom,0px));width:calc(100% - 32px);max-width:488px;background:var(--fg);color:var(--bg);border-radius:12px;padding:11px 14px;display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.2)}
.toast button{border:0;background:none;color:var(--accent-soft);font-weight:700;padding:2px 4px}
:root[data-theme="dark"] .toast button{color:var(--accent-ink)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .toast button{color:var(--accent-ink)}}

@media (max-width:380px){.balance-total{font-size:32px}.stats .amt{font-size:14px}}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <h1 class="brand"><span class="coin" aria-hidden="true"></span>Qirsh</h1>
  <span class="top-sub" id="topSub"></span>
</div></header>

<main><div class="wrap">
  <section class="view" id="v-home"></section>
  <section class="view" id="v-history" hidden></section>
  <section class="view" id="v-budgets" hidden></section>
  <section class="view" id="v-settings" hidden></section>
</div></main>

<button class="fab" id="fab" data-act="new" aria-label="Add transaction"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>

<nav class="tabs" aria-label="Sections"><div class="wrap">
  <button data-act="nav" data-v="home" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M4 10.5 12 4l8 6.5V20h-5.5v-5h-5v5H4z"/></svg>Home</button>
  <button data-act="nav" data-v="history"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg>History</button>
  <button data-act="nav" data-v="budgets"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="8"/><path d="M12 4v8l5.7 5.7"/></svg>Budgets</button>
  <button data-act="nav" data-v="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>Settings</button>
</div></nav>

<div class="scrim" id="scrim" data-act="close" hidden></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" hidden></div>
<div class="toast" id="toast" role="status" hidden></div>
<input type="file" id="importFile" accept="application/json,.json" hidden>

<script>
(function(){
'use strict';
const KEY='qirsh.v1';
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parseYmd=s=>{const p=String(s).split('-').map(Number);return new Date(p[0],p[1]-1,p[2]);};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x;};
const startOfDay=d=>new Date(d.getFullYear(),d.getMonth(),d.getDate());
const MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
const DAYS=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const firstGlyph=s=>{if(!s)return '';try{if(typeof Intl!=='undefined'&&Intl.Segmenter){return new Intl.Segmenter().segment(s)[Symbol.iterator]().next().value.segment;}}catch(e){}return Array.from(s)[0]||'';};
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const ICON={
  edit:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16z"/></svg>',
  close:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>',
  left:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 5l-7 7 7 7"/></svg>',
  right:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 5l7 7-7 7"/></svg>',
  up:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 15l6-6 6 6"/></svg>',
  down:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 9l6 6 6-6"/></svg>',
  trash:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M5 7h14M10 7V4h4v3M7 7l1 13h8l1-13"/></svg>'
};

const ACCOUNTS=[{id:'wallet',name:'Wallet'},{id:'savings',name:'Savings'},{id:'whish',name:'Whish'}];
const accName=id=>(ACCOUNTS.find(a=>a.id===id)||{name:id}).name;
const DEFAULT_CATS=[
  ['food','Food','expense'],['coffee','Coffee','expense'],['groceries','Groceries','expense'],['transport','Transport','expense'],
  ['bills','Bills & generator','expense'],['phone','Phone & internet','expense'],['uni','University','expense'],['outing','Going out','expense'],
  ['shopping','Shopping','expense'],['health','Health','expense'],['gifts','Gifts','expense'],['other','Other','expense'],
  ['salary','Salary','income'],['side','Side work','income'],['gift-in','Gift','income'],['other-in','Other income','income']
].map(([id,name,type])=>({id,name,type}));
const PROTECTED=['other','other-in'];

function blankState(){
  return {app:'qirsh',version:1,rate:89500,
    settings:{display:'USD',weekStart:1},
    opening:{wallet:{USD:0,LBP:0},savings:{USD:0,LBP:0},whish:{USD:0,LBP:0}},
    categories:DEFAULT_CATS.map(c=>Object.assign({},c)),tx:[],budgets:[],lastExport:null,sample:false};
}
function sampleState(){
  const s=blankState(); s.sample=true;

function isValid(s){return !!s&&typeof s==='object'&&Array.isArray(s.tx);}
function normalize(s){
  const b=blankState();
  const out=Object.assign({},b,s);
  out.settings=Object.assign({},b.settings,s.settings||{});
  out.opening={};
  ACCOUNTS.forEach(a=>{const o=(s.opening||{})[a.id]||{};out.opening[a.id]={USD:+o.USD||0,LBP:+o.LBP||0};});
  out.categories=Array.isArray(s.categories)&&s.categories.length?s.categories:b.categories;
  PROTECTED.forEach(id=>{if(!out.categories.some(c=>c.id===id))out.categories.push(Object.assign({},b.categories.find(c=>c.id===id)));});
  out.budgets=Array.isArray(s.budgets)?s.budgets:[];
  out.tx=s.tx.filter(t=>t&&t.type&&isFinite(+t.amount)&&t.date).map(t=>{const x=Object.assign({},t,{amount:+t.amount});
    if(x.amount2!=null){x.amount2=+x.amount2||0;if(!x.amount2)delete x.amount2;}
    if(x.change){const b={USD:0,LBP:0};b[x.change.currency]=+x.change.amount||0;x.back=b;delete x.change;}
    if(x.back){x.back={USD:+x.back.USD||0,LBP:+x.back.LBP||0};if(!x.back.USD&&!x.back.LBP)delete x.back;}
    return x;});
  out.rate=+s.rate>0?+s.rate:b.rate;
  delete out.exportedAt;
  return out;
}
function load(){
  try{const raw=localStorage.getItem(KEY);if(raw){const s=JSON.parse(raw);if(isValid(s))return normalize(s);}}catch(e){}
  return sampleState();
}
/* Inside the iOS app (Capacitor) data is also kept in native storage, which iOS never clears the way it can clear web storage. */
const NATIVE=!!(window.Capacitor&&typeof window.Capacitor.isNativePlatform==='function'&&window.Capacitor.isNativePlatform());
const nat=(plugin,method,opts)=>window.Capacitor.nativePromise(plugin,method,opts||{});
function save(){state.savedAt=Date.now();const raw=JSON.stringify(state);
  try{localStorage.setItem(KEY,raw);}catch(e){}
  if(NATIVE)nat('Preferences','set',{key:KEY,value:raw}).catch(()=>{});}
function syncNative(){if(!NATIVE)return;
  nat('Preferences','get',{key:KEY}).then(r=>{let s=null;try{s=r&&r.value?JSON.parse(r.value):null;}catch(e){}
    let hasLocal=false;try{hasLocal=!!localStorage.getItem(KEY);}catch(e){}
    if(s&&isValid(s)&&(!hasLocal||(+s.savedAt||0)>(+state.savedAt||0))){state=normalize(s);try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}render();}
    else if(hasLocal)nat('Preferences','set',{key:KEY,value:JSON.stringify(state)}).catch(()=>{});
  }).catch(()=>{});}

let state=load();

/* ---------- money ---------- */
function fmt(n,cur,o){o=o||{};const neg=n<0,a=Math.abs(n);let s;
  if(cur==='USD'){const r=Math.round(a*100)/100;s='$'+r.toLocaleString('en-US',{minimumFractionDigits:(o.whole||Number.isInteger(r))?0:2,maximumFractionDigits:o.whole?0:2});}
  else{const r=o.round?Math.round(a/1000)*1000:Math.round(a);s=r.toLocaleString('en-US')+' LL';}
  return (neg&&Math.abs(n)>=0.005?'−':(o.sign?'+':''))+s;}
const toUSD=(a,c)=>c==='USD'?a:a/state.rate;
const fromUSD=(u,c)=>c==='USD'?u:u*state.rate;
const other=c=>c==='USD'?'LBP':'USD';
const vUSD=v=>v.USD+v.LBP/state.rate;
function payVec(t){const v={USD:0,LBP:0};v[t.currency]+=+t.amount||0;if(t.amount2)v[other(t.currency)]+=+t.amount2;return v;}
function backVec(t){if(t.back)return {USD:+t.back.USD||0,LBP:+t.back.LBP||0};const v={USD:0,LBP:0};if(t.change)v[t.change.currency]+=+t.change.amount||0;return v;}
const txCostUSD=t=>vUSD(payVec(t))-(t.type==='expense'?vUSD(backVec(t)):0);
const payParts=t=>{const p=[fmt(t.amount,t.currency)];if(t.amount2)p.push(fmt(+t.amount2,other(t.currency)));return p;};
const backParts=t=>{const b=backVec(t),p=[];if(b.USD>0)p.push(fmt(b.USD,'USD'));if(b.LBP>0)p.push(fmt(b.LBP,'LBP'));return p;};
const fmtDisp=(usd,o)=>{const c=state.settings.display;return fmt(fromUSD(usd,c),c,Object.assign({round:true},o||{}));};
function parseAmt(s){s=String(s||'').trim().toLowerCase().replace(/[,\s]/g,'');let m=1;
  if(/k$/.test(s)){m=1e3;s=s.slice(0,-1);}else if(/m$/.test(s)){m=1e6;s=s.slice(0,-1);}
  const n=parseFloat(s);return isFinite(n)?n*m:NaN;}

function balances(){
  const b={};ACCOUNTS.forEach(a=>{const o=state.opening[a.id]||{};b[a.id]={USD:+o.USD||0,LBP:+o.LBP||0};});
  const acc=id=>(b[id]=b[id]||{USD:0,LBP:0});
  for(const t of state.tx){
    if(t.type==='expense'||t.type==='income'){const a=acc(t.account||'wallet'),p=payVec(t),sg=t.type==='expense'?-1:1;a.USD+=sg*p.USD;a.LBP+=sg*p.LBP;
      if(t.type==='expense'){const k=backVec(t);a.USD+=k.USD;a.LBP+=k.LBP;}}
    else if(t.type==='transfer'){acc(t.from)[t.currency]-=t.amount;acc(t.to)[t.toCurrency||t.currency]+=(t.toAmount!=null?+t.toAmount:t.amount);}
  }
  return b;
}
const combinedUSD=x=>x.USD+x.LBP/state.rate;

/* ---------- periods & budgets ---------- */
function range(period,ref){const d=startOfDay(ref||new Date());
  if(period==='month')return{start:new Date(d.getFullYear(),d.getMonth(),1),end:new Date(d.getFullYear(),d.getMonth()+1,1)};
  const back=(d.getDay()-state.settings.weekStart+7)%7;const start=addDays(d,-back);return{start,end:addDays(start,7)};}
const inRange=(t,r)=>{const d=parseYmd(t.date);return d>=r.start&&d<r.end;};
function sumUSD(r,type,catId){let s=0;for(const t of state.tx){if(t.type!==type)continue;if(catId&&t.categoryId!==catId)continue;if(!inRange(t,r))continue;s+=txCostUSD(t);}return s;}
function budgetStatus(b){
  const r=range(b.period);const spent=sumUSD(r,'expense',b.categoryId||null);const limit=toUSD(+b.amount,b.currency);
  const pct=limit>0?spent/limit:0;const daysLeft=Math.max(1,Math.round((r.end-startOfDay(new Date()))/864e5));
  return {spent,limit,pct,left:limit-spent,daysLeft,state:pct>=1?'over':pct>=.8?'warn':'ok'};
}
const catOf=id=>state.categories.find(c=>c.id===id);
const catName=id=>(catOf(id)||{name:'Uncategorised'}).name;
const budgetName=b=>b.categoryId?catName(b.categoryId):'All spending';

/* ---------- repeatable transactions ---------- */
function tplKey(t){return [t.type,t.categoryId||'',t.amount,t.currency,(t.note||'').trim().toLowerCase(),t.from||'',t.to||'',t.toCurrency||'',t.type==='transfer'&&t.toCurrency!==t.currency?t.toAmount:'',t.amount2||'',(t=>{const k=backVec(t);return k.USD+'/'+k.LBP;})(t)].join('|');}
function templates(){
  const m=new Map();
  for(const t of state.tx){const k=tplKey(t);const e=m.get(k)||{key:k,tx:t,count:0,last:0};e.count++;
    if((t.createdAt||0)>=e.last){e.last=t.createdAt||0;e.tx=t;}m.set(k,e);}
  const all=[...m.values()];
  return {
    frequent:all.filter(e=>e.count>=2).sort((a,b)=>b.count-a.count||b.last-a.last).slice(0,8),
    recent:all.sort((a,b)=>b.last-a.last).slice(0,8)
  };
}
function cloneForToday(t){const c=Object.assign({},t,{id:uid(),date:ymd(new Date()),createdAt:Date.now()});return c;}

/* ---------- presentation helpers ---------- */
function txTitle(t){if(t.type==='transfer')return t.from===t.to?'Exchange':accName(t.from)+' → '+accName(t.to);return catName(t.categoryId);}
function txRate(t){if(t.type!=='transfer'||!t.toCurrency||t.toCurrency===t.currency)return 0;const usd=t.currency==='USD'?t.amount:+t.toAmount,lbp=t.currency==='LBP'?t.amount:+t.toAmount;return usd>0?lbp/usd:0;}
const rateTxt=r=>Math.round(r).toLocaleString('en-US')+' LL/$';
function rowSub(t){
  if(t.type==='transfer'){const p=[];if(t.note)p.push(txTitle(t));if(t.from===t.to&&t.from!=='wallet')p.push(accName(t.from));const r=txRate(t);if(r)p.push('at '+rateTxt(r));return p.join(' · ')||'Transfer';}
  return t.note?txTitle(t):cap(t.type);}
function txGlyph(t){
  if(t.type==='transfer')return '<span class="glyph tr" aria-hidden="true">'+(t.from===t.to?'⇄':'→')+'</span>';
  const c=catOf(t.categoryId);const g=c&&c.icon?c.icon:catName(t.categoryId).charAt(0);return '<span class="glyph'+(t.type==='income'&&!(c&&c.icon)?' in':'')+'" aria-hidden="true">'+esc(g)+'</span>';}
function txAmt(t){
  if(t.type==='transfer'){const diff=(t.toCurrency||t.currency)!==t.currency;
    return '<span class="amt tr">'+fmt(t.amount,t.currency)+(diff?' → '+fmt(+t.toAmount,t.toCurrency):'')+'</span>';}
  const p=payParts(t),k=t.type==='expense'?backParts(t):[];
  if(t.type==='income')return '<span class="amt in'+(p.length>1?' has-chg':'')+'">'+p.map(x=>'<span>+'+x+'</span>').join('')+'</span>';
  if(p.length===1&&!k.length)return '<span class="amt">'+p[0]+'</span>';
  return '<span class="amt has-chg">'+p.map(x=>'<span>'+x+'</span>').join('')+(k.length?'<span class="chg">+'+k.join(' + ')+' back</span>':'')+'</span>';}
function dayLabel(s){const d=parseYmd(s),t=startOfDay(new Date());const diff=Math.round((t-d)/864e5);
  if(diff===0)return 'Today';if(diff===1)return 'Yesterday';return DAYS[d.getDay()]+' '+d.getDate()+' '+MONTHS[d.getMonth()].slice(0,3);}
function budgetHtml(b,clickable){
  const s=budgetStatus(b);const c=b.currency;const per=b.period==='week'?'Week':'Month';
  const pill=s.state==='over'?'<span class="pill over">Over</span>':s.state==='warn'?'<span class="pill warn">'+Math.round(s.pct*100)+'%</span>':'<span class="pill">'+per+'</span>';
  const left=s.left>=0?fmt(fromUSD(s.left,c),c,{round:true})+' left':fmt(fromUSD(-s.left,c),c,{round:true})+' over';
  const perDay=s.left>0?fmt(fromUSD(s.left/s.daysLeft,c),c,{round:true})+'/day for '+s.daysLeft+' day'+(s.daysLeft>1?'s':''):s.daysLeft+' day'+(s.daysLeft>1?'s':'')+' left in '+b.period;
  const tag=clickable?'button':'div';
  return '<'+tag+' class="budget"'+(clickable?' data-act="editBudget" data-id="'+esc(b.id)+'"':'')+'>'+
    '<div class="b-top"><span class="b-name"><span>'+esc(budgetName(b))+'</span>'+pill+'</span>'+
    '<span class="b-nums">'+fmt(fromUSD(s.spent,c),c,{round:true})+' <span class="muted">/ '+fmt(+b.amount,c)+'</span></span></div>'+
    '<div class="bar '+s.state+'"><i style="width:'+Math.min(100,s.pct*100).toFixed(1)+'%"></i></div>'+
    '<div class="b-foot"><span>'+left+'</span><span>'+perDay+'</span></div></'+tag+'>';
}

/* ---------- views ---------- */

const hist={month:new Date(new Date().getFullYear(),new Date().getMonth(),1),filter:'all',q:''};
let pendingImport=null, armed=null;

function renderHistory(){
  const m=hist.month;const r={start:m,end:new Date(m.getFullYear(),m.getMonth()+1,1)};
  const q=hist.q.trim().toLowerCase();
  let txs=state.tx.filter(t=>inRange(t,r)&&(hist.filter==='all'||t.type===hist.filter));
  if(q)txs=txs.filter(t=>(t.note||'').toLowerCase().includes(q)||txTitle(t).toLowerCase().includes(q)||(String(t.amount)+' '+(t.amount2||'')).includes(q));
  txs.sort((a,b)=>b.date.localeCompare(a.date)||(b.createdAt||0)-(a.createdAt||0));
  const spent=sumUSD(r,'expense'),inc=sumUSD(r,'income');
  let h='<div class="month-switch"><button class="icon-btn" data-act="month" data-v="-1" aria-label="Previous month">'+ICON.left+'</button><strong>'+MONTHS[m.getMonth()]+' '+m.getFullYear()+'</strong><button class="icon-btn" data-act="month" data-v="1" aria-label="Next month">'+ICON.right+'</button></div>';
  h+='<div class="stats"><div class="stat"><span class="label">Spent</span><span class="amt">'+fmtDisp(spent)+'</span></div><div class="stat"><span class="label">Earned</span><span class="amt in">'+fmtDisp(inc)+'</span></div><div class="stat"><span class="label">Entries</span><span class="amt">'+txs.length+'</span></div></div>';
  h+='<div class="filters"><div class="seg">'+[['all','All'],['expense','Out'],['income','In'],['transfer','Moves']].map(([k,l])=>'<button data-act="hfilter" data-v="'+k+'" aria-pressed="'+(hist.filter===k)+'">'+l+'</button>').join('')+'</div>'+
     '<input class="input search" id="hq" type="search" placeholder="Search notes" value="'+esc(hist.q)+'" aria-label="Search notes"></div>';
  h+='<div id="histList">'+historyList(txs)+'</div>';
  $('#v-history').innerHTML=h;
}
function historyList(txs){
  if(!txs.length)return '<div class="list"><p class="empty">Nothing here for this month.</p></div>';
  let h='',cur=null,group=[];
  const flush=()=>{if(!group.length)return;let out=0;group.forEach(t=>{if(t.type==='expense')out+=txCostUSD(t);});
    h+='<div class="day-head"><span>'+dayLabel(cur)+'</span><span class="num">'+(out?fmtDisp(out):'')+'</span></div><div class="list">'+
    group.map(t=>'<button class="row" data-act="editTx" data-id="'+esc(t.id)+'">'+txGlyph(t)+'<span class="row-main"><span class="row-title">'+esc(t.note||txTitle(t))+'</span><span class="row-sub">'+esc(rowSub(t))+'</span></span>'+txAmt(t)+'</button>').join('')+'</div>';group=[];};
  txs.forEach(t=>{if(t.date!==cur){flush();cur=t.date;}group.push(t);});flush();return h;
}

function render(){
  ['home','history','budgets','settings'].forEach(v=>{$('#v-'+v).hidden=v!==view;});
  document.querySelectorAll('.tabs button').forEach(b=>{if(b.dataset.v===view)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');});
  const b=balances();
  $('#topSub').textContent={home:DAYS[new Date().getDay()]+' '+new Date().getDate()+' '+MONTHS[new Date().getMonth()],history:'History',budgets:'Budgets',settings:'Settings'}[view];
  ({home:renderHome,history:renderHistory,budgets:renderBudgets,settings:renderSettings})[view]();
  updateNotesList();
}
function commit(){save();render();}

/* ---------- toast ---------- */
let toastTimer=null,undoFn=null;
function toast(msg,undo){const el=$('#toast');undoFn=undo||null;
  el.innerHTML='<span>'+esc(msg)+'</span>'+(undo?'<button data-act="undo">Undo</button>':'');el.hidden=false;
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>{el.hidden=true;undoFn=null;},undo?5000:2800);}

/* ---------- sheets ---------- */
let form=null,sheetKind=null;
function openSheet(kind){sheetKind=kind;$('#toast').hidden=true;$('#scrim').hidden=false;$('#sheet').hidden=false;drawSheet();}
function closeSheet(){$('#scrim').hidden=true;$('#sheet').hidden=true;sheetKind=null;form=null;}
function drawSheet(){const el=$('#sheet');el.innerHTML='<div class="grab"></div>'+(sheetKind==='tx'?txSheet():budgetSheet());
  if(sheetKind==='tx')updatePreview();
  const a=el.querySelector('#f-pay0');if(a&&!form.id&&!form.noFocus)setTimeout(()=>{try{a.focus();}catch(e){}},60);form.noFocus=true;}

function newTxForm(type,extra){return Object.assign({mode:'new',type:type||'expense',pay:[{cur:'USD',v:''}],back:[],categoryId:null,note:'',date:ymd(new Date()),from:'wallet',to:'savings',toAmount:'',toCurrency:'USD',toTouched:false,xrate:state.rate.toLocaleString('en-US'),setRate:false},extra||{});}
function formFromTx(t,mode){
  const pay=[{cur:t.currency,v:String(t.amount)}];if(t.amount2)pay.push({cur:other(t.currency),v:String(t.amount2)});
  const k=backVec(t),back=[];[other(t.currency),t.currency].forEach(c=>{if(k[c]>0)back.push({cur:c,v:String(k[c])});});
  const isX=t.type==='transfer'&&t.from===t.to,r=txRate(t);
  return {mode,id:mode==='edit'?t.id:null,type:isX?'exchange':t.type,pay:t.type==='transfer'?pay.slice(0,1):pay,xrate:Math.round(r||state.rate).toLocaleString('en-US'),setRate:false,back:t.type==='expense'?back:[],categoryId:t.categoryId||null,note:t.note||'',date:mode==='edit'?t.date:ymd(new Date()),
    from:t.from||'wallet',to:t.to||'savings',toAmount:t.toAmount!=null?String(t.toAmount):'',toCurrency:t.toCurrency||t.currency,toTouched:t.type==='transfer'&&t.toCurrency!==t.currency};}
function curToggle(act,val,attrs){return '<div class="seg">'+[['USD','USD'],['LBP','LL']].map(([k,l])=>'<button data-act="'+act+'" data-v="'+k+'"'+(attrs||'')+' aria-pressed="'+(val===k)+'">'+l+'</button>').join('')+'</div>';}
const curLabel=c=>c==='USD'?'$':'LL';
function moneyLines(kind,lines){
  const many=lines.length>1;
  return '<div class="lines">'+lines.map((ln,i)=>'<div class="amount-row"><input id="f-'+kind+i+'" data-line="'+kind+'" data-i="'+i+'" class="amount-input'+(kind==='back'?' sm':'')+'" inputmode="decimal" autocomplete="off" placeholder="0" value="'+esc(ln.v)+'" aria-label="'+(kind==='pay'?'Amount':'Change')+' in '+(ln.cur==='USD'?'USD':'LL')+'">'+
    (ln.cur==='LBP'?'<button class="k000" data-act="k000" data-k="'+kind+'" data-i="'+i+'" aria-label="Add three zeros">000</button>':(many?'<span class="k000 ghost" aria-hidden="true">000</span>':''))+
    (many?'<span class="cur-tag">'+(ln.cur==='USD'?'USD':'LL')+'</span>':curToggle('lcur',ln.cur,' data-k="'+kind+'"'))+
    (kind==='back'||i>0?'<button class="icon-btn" data-act="lrm" data-k="'+kind+'" data-i="'+i+'" aria-label="Remove this amount">'+ICON.close+'</button>':(many?'<span class="icon-btn" aria-hidden="true"></span>':''))+
    '</div>').join('')+'</div>';}
function txSheet(){
  const f=form,isX=f.type==='exchange',isT=f.type==='transfer'||isX,isE=f.type==='expense';
  const cats=state.categories.filter(c=>c.type===(f.type==='income'?'income':'expense'));
  let h='<div class="sheet-head"><h2>'+(f.mode==='edit'?'Edit entry':'New entry')+'</h2><button class="icon-btn" data-act="close" aria-label="Close">'+ICON.close+'</button></div>';
  h+='<div class="seg wide">'+[['expense','Expense'],['income','Income'],['transfer','Transfer'],['exchange','Exchange']].map(([k,l])=>'<button data-act="ftype" data-v="'+k+'" aria-pressed="'+(f.type===k)+'">'+l+'</button>').join('')+'</div>';
  if(isT&&!isX)h+='<div class="grid2"><label class="field"><span>From</span><select id="f-from">'+ACCOUNTS.map(a=>'<option value="'+a.id+'"'+(f.from===a.id?' selected':'')+'>'+a.name+'</option>').join('')+'</select></label>'+
    '<label class="field"><span>To</span><select id="f-to">'+ACCOUNTS.map(a=>'<option value="'+a.id+'"'+(f.to===a.id?' selected':'')+'>'+a.name+'</option>').join('')+'</select></label></div>';
  if(isX)h+='<span class="sub-label" style="margin-bottom:-12px">You give</span>';
  h+=moneyLines('pay',isT?f.pay.slice(0,1):f.pay)+(isX?'':'<p class="hint" id="f-preview"></p>');
  if(!isT){const links=[];
    if(f.pay.length===1)links.push('<button class="link" data-act="ladd" data-k="pay">+ Also '+(isE?'paid':'got')+' in '+curLabel(other(f.pay[0].cur))+'</button>');
    if(isE&&!f.back.length)links.push('<button class="link" data-act="ladd" data-k="back">+ Got change back</button>');
    if(links.length)h+='<div class="links">'+links.join('')+'</div>';
    if(isE&&f.back.length)h+='<div class="sub-lines"><span class="sub-label">Change back</span>'+moneyLines('back',f.back)+'</div>'+
      (f.back.length===1?'<div class="links" style="margin-top:-8px"><button class="link" data-act="ladd" data-k="back">+ Also got '+curLabel(other(f.back[0].cur))+' back</button></div>':'');}
  if(isX){const gc=other(f.pay[0].cur);
    h+='<div class="sub-lines"><span class="sub-label">You get</span><div class="amount-row"><input id="f-toamount" class="amount-input" inputmode="decimal" autocomplete="off" placeholder="0" value="'+esc(f.toAmount)+'" aria-label="Amount received in '+(gc==='USD'?'USD':'LL')+'">'+
      (gc==='LBP'?'<button class="k000" data-act="k000to" aria-label="Add three zeros">000</button>':'')+'<span class="cur-tag">'+(gc==='USD'?'USD':'LL')+'</span></div></div>';
    h+='<div class="grid2"><label class="field"><span>Account</span><select id="f-acct">'+ACCOUNTS.map(a=>'<option value="'+a.id+'"'+(f.from===a.id?' selected':'')+'>'+a.name+'</option>').join('')+'</select></label>'+
      '<label class="field"><span>Rate</span><span class="rate-in"><span>$1 =</span><input id="f-xrate" class="input num" inputmode="numeric" autocomplete="off" value="'+esc(f.xrate)+'" aria-label="LL per dollar"><span>LL</span></span></label></div>';
    h+='<p class="hint" id="f-preview" style="margin:0"></p><button class="chip sm" id="f-setrate" data-act="fsetrate" aria-pressed="'+f.setRate+'" hidden></button>';}
  else if(isT){h+='<div class="sub-lines"><span class="sub-label">Arrives as</span><div class="amount-row"><input id="f-toamount" class="amount-input sm" inputmode="decimal" autocomplete="off" placeholder="0" value="'+esc(f.toAmount)+'" aria-label="Amount received">'+curToggle('ftocur',f.toCurrency)+'</div></div>'+
    '<p class="note">Same currency moves it as is. Pick the other currency to exchange on the way, like cash dollars into Whish.</p>';}
  else h+='<div class="chips" role="group" aria-label="Category">'+cats.map(c=>'<button class="chip" data-act="fcat" data-v="'+esc(c.id)+'" aria-pressed="'+(f.categoryId===c.id)+'">'+(c.icon?esc(c.icon)+' ':'')+esc(c.name)+'</button>').join('')+'</div>';
  h+='<div class="grid2"><label class="field"><span>Note</span><input id="f-note" list="notesList" autocomplete="off" value="'+esc(f.note)+'" placeholder="Optional"></label><label class="field"><span>Date</span><input id="f-date" type="date" value="'+esc(f.date)+'"></label></div>';
  h+='<p class="form-error" id="f-err" hidden></p><div class="sheet-actions">'+(f.mode==='edit'?'<button class="btn danger'+(armed==='tx'?' armed':'')+'" data-act="fdel">'+(armed==='tx'?'Tap to confirm':'Delete')+'</button>':'')+
     '<button class="btn primary" data-act="fsave">'+(f.mode==='edit'?'Save changes':'Add')+'</button></div>';
  return h;
}
const linesVec=ls=>{const v={USD:0,LBP:0};ls.forEach(l=>{const n=parseAmt(l.v);if(n>0)v[l.cur]+=n;});return v;};
const isMove=f=>f.type==='transfer'||f.type==='exchange';
const formRate=f=>{if(f.type!=='exchange')return state.rate;const r=parseAmt(f.xrate);return r>0?r:state.rate;};
function impliedRate(f){const a=parseAmt(f.pay[0].v),b=parseAmt(f.toAmount);if(!(a>0&&b>0)||f.toCurrency===f.pay[0].cur)return 0;return f.pay[0].cur==='USD'?b/a:a/b;}
function autoTo(){const f=form;if(!isMove(f)||f.toTouched)return;const p=f.pay[0],a=parseAmt(p.v),r=formRate(f);
  if(!isFinite(a)){f.toAmount='';return;}
  if(f.toCurrency===p.cur)f.toAmount=String(a);
  else if(f.toCurrency==='LBP')f.toAmount=String(Math.round(a*r));
  else f.toAmount=String(Math.round(a/r*100)/100);}
function updatePreview(){const el=$('#f-preview');if(!el||!form)return;
  if(form.type==='exchange'){const a=parseAmt(form.pay[0].v),g=parseAmt(form.toAmount),gc=form.toCurrency,pc=form.pay[0].cur;
    el.textContent=a>0&&g>0?accName(form.from)+': −'+fmt(a,pc)+'  +'+fmt(g,gc):'';
    const t=$('#f-toamount');if(t&&!form.toTouched&&document.activeElement!==t)t.value=form.toAmount;
    const ir=impliedRate(form),x=$('#f-xrate');if(x&&form.toTouched&&ir&&document.activeElement!==x){x.value=Math.round(ir).toLocaleString('en-US');form.xrate=x.value;}
    const sr=$('#f-setrate');if(sr){const show=ir>0&&Math.round(ir)!==Math.round(state.rate);sr.hidden=!show;if(!show)form.setRate=false;
      sr.textContent=(form.setRate?'✓ ':'')+'Also make '+Math.round(ir).toLocaleString('en-US')+' my app rate';sr.setAttribute('aria-pressed',String(form.setRate));}
    return;}
  const ls=isMove(form)?form.pay.slice(0,1):form.pay,pv=linesVec(ls),P=vUSD(pv);let txt='';
  if(P>0){if(ls.length===1){const a=pv[ls[0].cur];txt=ls[0].cur==='LBP'?fmt(a,'LBP')+'  ≈ '+fmt(a/state.rate,'USD'):fmt(a,'USD')+'  ≈ '+fmt(a*state.rate,'LBP',{round:true});}
    else txt='Total '+fmt(P,'USD')+'  ≈ '+fmt(P*state.rate,'LBP',{round:true});}
  if(form.type==='expense'&&form.back.length&&P>0){const K=vUSD(linesVec(form.back));
    if(K>0){const cost=P-K;txt=cost<0?'The change is more than you paid':'Costs '+fmt(cost,'USD')+'  ≈ '+fmt(cost*state.rate,'LBP',{round:true});}}
  el.textContent=txt;
  const t=$('#f-toamount');if(t&&!form.toTouched&&document.activeElement!==t)t.value=form.toAmount;}
function readForm(){const f=form;['note','date','toamount','from','to','acct','xrate'].forEach(k=>{const el=$('#f-'+k);if(el){if(k==='toamount')f.toAmount=el.value;else if(k==='acct'){f.from=f.to=el.value;}else f[k]=el.value;}});
  document.querySelectorAll('[data-line]').forEach(el=>{const ln=(f[el.dataset.line]||[])[+el.dataset.i];if(ln)ln.v=el.value;});}
function saveTx(){
  readForm();const f=form,err=$('#f-err');
  const fail=m=>{err.textContent=m;err.hidden=false;};
  const isX=f.type==='exchange',isT=f.type==='transfer'||isX,isE=f.type==='expense';
  const payLs=isT?f.pay.slice(0,1):f.pay,backLs=isE?f.back:[];
  const bad=ls=>ls.some(l=>String(l.v).trim()!==''&&!(parseAmt(l.v)>0));
  if(bad(payLs)||bad(backLs))return fail('Amounts must be numbers above zero.');
  const pv=linesVec(payLs);
  if(!(vUSD(pv)>0))return fail('Enter an amount above zero.');
  if(!f.date)return fail('Pick a date.');
  const first=payLs.find(l=>parseAmt(l.v)>0).cur;
  let t={id:f.id||uid(),type:isX?'transfer':f.type,amount:pv[first],currency:first,note:f.note.trim(),date:f.date,createdAt:Date.now()};
  if(pv[other(first)]>0)t.amount2=pv[other(first)];
  if(isT){const ta=parseAmt(f.toAmount);
    if(!(ta>0))return fail(isX?'Enter what you get back.':'Enter the amount that arrives.');
    if(isX){f.to=f.from;f.toCurrency=other(first);}
    else if(f.from===f.to)return fail('Pick two different accounts. To change $ into LL in one account, use Exchange.');
    Object.assign(t,{from:f.from,to:f.to,toAmount:ta,toCurrency:f.toCurrency});}
  else{if(!f.categoryId)return fail('Pick a category.');Object.assign(t,{categoryId:f.categoryId,account:'wallet'});
    if(isE&&backLs.length){const kv=linesVec(backLs);
      if(!(vUSD(kv)>0))return fail('Enter the change you got back, or remove it.');
      if(vUSD(kv)>vUSD(pv)+1e-9)return fail('The change is more than you paid.');
      t.back={USD:kv.USD,LBP:kv.LBP};}}
  if(isX&&f.setRate){const ir=impliedRate(f);if(ir>0)state.rate=Math.round(ir);}
  if(f.mode==='edit'){const i=state.tx.findIndex(x=>x.id===f.id);if(i>=0){t.createdAt=state.tx[i].createdAt||t.createdAt;state.tx[i]=t;}closeSheet();commit();toast('Saved');}
  else{state.tx.push(t);closeSheet();commit();toast((isX?'Exchanged ':isT?'Moved ':'Added ')+(t.note||txTitle(t))+' · '+payParts(t).join(' + ')+(isT&&t.toCurrency!==t.currency?' → '+fmt(t.toAmount,t.toCurrency):''),()=>{state.tx=state.tx.filter(x=>x.id!==t.id);commit();});}
}

function budgetSheet(){const f=form;const cats=state.categories.filter(c=>c.type==='expense');
  let h='<div class="sheet-head"><h2>'+(f.id?'Edit budget':'New budget')+'</h2><button class="icon-btn" data-act="close" aria-label="Close">'+ICON.close+'</button></div>';
  h+='<label class="field"><span>Applies to</span><select id="b-cat"><option value="">All spending (overall cap)</option>'+cats.map(c=>'<option value="'+esc(c.id)+'"'+(f.categoryId===c.id?' selected':'')+'>'+esc(c.name)+'</option>').join('')+'</select></label>';
  h+='<div class="field"><span>Resets every</span><div class="seg wide">'+[['week','Week'],['month','Month']].map(([k,l])=>'<button data-act="bperiod" data-v="'+k+'" aria-pressed="'+(f.period===k)+'">'+l+'</button>').join('')+'</div></div>';
  h+='<div class="amount-row"><input id="b-amount" class="amount-input" inputmode="decimal" placeholder="0" value="'+esc(f.amount)+'" aria-label="Limit">'+curToggle('bcur',f.currency)+'</div>';
  h+='<p class="form-error" id="b-err" hidden></p><div class="sheet-actions">'+(f.id?'<button class="btn danger'+(armed==='budget'?' armed':'')+'" data-act="bdel">'+(armed==='budget'?'Tap to confirm':'Delete')+'</button>':'')+'<button class="btn primary" data-act="bsave">'+(f.id?'Save changes':'Add budget')+'</button></div>';
  return h;}
function readBudget(){const c=$('#b-cat'),a=$('#b-amount');if(c)form.categoryId=c.value||null;if(a)form.amount=a.value;}
function saveBudget(){readBudget();const f=form;const a=parseAmt(f.amount);const err=$('#b-err');
  if(!(a>0)){err.textContent='Enter a limit above zero.';err.hidden=false;return;}
  const dup=state.budgets.find(b=>b.id!==f.id&&(b.categoryId||null)===(f.categoryId||null)&&b.period===f.period);
  if(dup){err.textContent='A '+f.period+'ly budget for '+budgetName(f)+' already exists. Edit that one instead.';err.hidden=false;return;}
  const b={id:f.id||uid(),categoryId:f.categoryId||null,period:f.period,amount:a,currency:f.currency};
  const i=state.budgets.findIndex(x=>x.id===b.id);if(i>=0)state.budgets[i]=b;else state.budgets.push(b);
  closeSheet();commit();toast(f.id?'Budget saved':'Budget added');}

/* ---------- export / import ---------- */
const exportText=()=>JSON.stringify(Object.assign({},state,{exportedAt:new Date().toISOString()}),null,2);
const exportName=()=>'qirsh-backup-'+ymd(new Date())+'.json';
function markExported(){state.lastExport=new Date().toISOString();save();}
async function exportNative(){const name=exportName();let uri;
  try{uri=(await nat('Filesystem','writeFile',{path:name,data:exportText(),directory:'DOCUMENTS',encoding:'utf8'})).uri;}
  catch(e){toast('Couldn’t save the backup. Use Copy JSON instead.');return;}
  markExported();render();toast('Saved '+name+' to Files › Qirsh');
  try{await nat('Share','share',{title:'Qirsh backup',files:[uri]});}catch(e){}}
async function exportShare(){
  try{const file=new File([exportText()],exportName(),{type:'application/json'});
    if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:'Qirsh backup'});markExported();render();toast('Backup shared');return;}
  }catch(e){if(e&&e.name==='AbortError')return;}
  toast('Sharing a file isn’t available here. Use Save file or Copy JSON.');}
function exportSave(){
  try{const url=URL.createObjectURL(new Blob([exportText()],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download=exportName();document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000);
    markExported();render();toast('Saving '+exportName());}catch(e){toast('Saving failed. Use Copy JSON instead.');}}
function exportCopy(){const txt=exportText();
  const show=()=>{$('#exportOut').innerHTML='<label class="field"><span>Select all and copy</span><textarea id="exportTxt" readonly></textarea></label>';const ta=$('#exportTxt');ta.value=txt;ta.focus();ta.select();};
  try{navigator.clipboard.writeText(txt).then(()=>{markExported();render();toast('Backup copied. Paste it somewhere safe.');},show);}catch(e){show();}}
function stageImport(text){
  let s;try{s=JSON.parse(text);}catch(e){toast('That isn’t valid JSON.');return;}
  if(!isValid(s)){toast('That file isn’t a Qirsh backup (no transactions list).');return;}
  pendingImport=normalize(s);render();}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el)return;const act=el.dataset.act,v=el.dataset.v,id=el.dataset.id;
  if(act!=='delCat'&&act!=='wipe'&&act!=='fdel'&&act!=='bdel')armed=null;
  switch(act){
    case 'nav':view=v;closeSheet();render();window.scrollTo(0,0);break;
    case 'new':form=newTxForm(view==='home'||view==='history'?'expense':'expense');openSheet('tx');break;
    case 'close':closeSheet();break;
    case 'undo':if(undoFn){undoFn();undoFn=null;}$('#toast').hidden=true;break;
    case 'toggleDisplay':state.settings.display=state.settings.display==='USD'?'LBP':'USD';commit();break;
    case 'quickTab':quickTab=v;render();break;
    case 'clearSample':{const keep={rate:state.rate,settings:state.settings,categories:state.categories};state=Object.assign(blankState(),keep);commit();toast('Example data cleared. Set your starting balances in Settings.');break;}
    case 'repeat':{const tp=[...templates().frequent,...templates().recent].find(x=>x.key===el.dataset.key);if(!tp)break;const t=cloneForToday(tp.tx);state.tx.push(t);commit();
      toast('Added '+(t.note||txTitle(t))+' · '+payParts(t).join(' + '),()=>{state.tx=state.tx.filter(x=>x.id!==t.id);commit();});break;}
    case 'repeatEdit':{const tp=[...templates().frequent,...templates().recent].find(x=>x.key===el.dataset.key);if(!tp)break;form=formFromTx(tp.tx,'new');openSheet('tx');break;}
    case 'newMove':form=v==='exchange'?newTxForm('exchange',{from:'wallet',to:'wallet',toCurrency:'LBP'}):newTxForm('transfer',{from:'wallet',to:'savings'});openSheet('tx');break;
    case 'fsetrate':form.setRate=!form.setRate;updatePreview();break;
    case 'k000to':{const n=$('#f-toamount');if(!n)break;n.value=(n.value||'')+'000';form.toAmount=n.value;form.toTouched=true;updatePreview();n.focus();break;}
    case 'transferTo':form=newTxForm('transfer',{from:'wallet',to:id});openSheet('tx');break;
    case 'editTx':{const t=state.tx.find(x=>x.id===id);if(!t)break;form=formFromTx(t,'edit');openSheet('tx');break;}
    case 'ftype':readForm();form.type=v;
      if(v==='exchange'){form.pay=form.pay.slice(0,1);form.to=form.from;form.toCurrency=other(form.pay[0].cur);form.toTouched=false;autoTo();}
      else if(v==='transfer'){form.pay=form.pay.slice(0,1);if(form.from===form.to)form.to=form.from==='wallet'?'savings':'wallet';form.toCurrency=form.pay[0].cur;form.toTouched=false;autoTo();}else{const c=catOf(form.categoryId);if(c&&c.type!==(v==='income'?'income':'expense'))form.categoryId=null;}drawSheet();break;
    case 'lcur':{readForm();const k=el.dataset.k,ls=form[k];if(!ls||!ls[0])break;ls[0].cur=v;
      if(k==='pay'){if(form.back.length===1&&!String(form.back[0].v).trim())form.back[0].cur=other(v);
        if(form.type==='exchange'){form.toCurrency=other(v);form.toTouched=false;}else if(!form.toTouched)form.toCurrency=v;autoTo();}
      drawSheet();break;}
    case 'ladd':{readForm();const k=el.dataset.k,ls=form[k];if(ls.length>=2)break;
      const cur=ls.length?other(ls[0].cur):(form.pay.length>1?'LBP':other(form.pay[0].cur));ls.push({cur,v:''});drawSheet();
      setTimeout(()=>{const n=$('#f-'+k+(ls.length-1));if(n)n.focus();},40);break;}
    case 'lrm':{readForm();form[el.dataset.k].splice(+el.dataset.i,1);drawSheet();break;}
    case 'k000':{const n=$('#f-'+el.dataset.k+el.dataset.i);if(!n)break;n.value=(n.value||'')+'000';const ln=form[el.dataset.k][+el.dataset.i];ln.v=n.value;if(el.dataset.k==='pay'&&el.dataset.i==='0')autoTo();updatePreview();n.focus();break;}
    case 'ftocur':readForm();form.toCurrency=v;form.toTouched=false;autoTo();drawSheet();break;
    case 'catMove':{const i=state.categories.findIndex(x=>x.id===id);if(i<0)break;const type=state.categories[i].type;let j=i+(+v);
      while(j>=0&&j<state.categories.length&&state.categories[j].type!==type)j+=(+v);
      if(j<0||j>=state.categories.length)break;const tmp=state.categories[i];state.categories[i]=state.categories[j];state.categories[j]=tmp;commit();break;}
    case 'fcat':readForm();form.categoryId=v;drawSheet();break;
    case 'fsave':saveTx();break;
    case 'fdel':if(armed!=='tx'){armed='tx';drawSheet();break;}{armed=null;const t=state.tx.find(x=>x.id===form.id);state.tx=state.tx.filter(x=>x.id!==form.id);closeSheet();commit();toast('Deleted',()=>{state.tx.push(t);commit();});}break;
    case 'newBudget':form={id:null,categoryId:null,period:'month',amount:'',currency:'USD'};openSheet('budget');break;
    case 'editBudget':{const b=state.budgets.find(x=>x.id===id);if(!b)break;form={id:b.id,categoryId:b.categoryId,period:b.period,amount:String(b.amount),currency:b.currency};openSheet('budget');break;}
    case 'bperiod':readBudget();form.period=v;drawSheet();break;
    case 'bcur':readBudget();form.currency=v;drawSheet();break;
    case 'bsave':saveBudget();break;
    case 'bdel':if(armed!=='budget'){armed='budget';drawSheet();break;}{armed=null;const b=state.budgets.find(x=>x.id===form.id);state.budgets=state.budgets.filter(x=>x.id!==form.id);closeSheet();commit();toast('Budget deleted',()=>{state.budgets.push(b);commit();});}break;
    case 'month':hist.month=new Date(hist.month.getFullYear(),hist.month.getMonth()+(+v),1);render();break;
    case 'hfilter':hist.filter=v;render();break;
    case 'setDisplay':state.settings.display=v;commit();break;
    case 'setWeek':state.settings.weekStart=+v;commit();break;
    case 'addCat':{const n=$('#newCatName').value.trim();if(!n){toast('Type a name for the category first.');break;}const ic=firstGlyph($('#newCatIcon').value.trim());state.categories.push(Object.assign({id:'c'+uid(),name:n,type:$('#newCatType').value},ic?{icon:ic}:{}));commit();toast('Added '+n);break;}
    case 'delCat':{if(armed!=='cat:'+id){armed='cat:'+id;render();break;}armed=null;const c=catOf(id);if(!c)break;const to=c.type==='expense'?'other':'other-in';
      state.tx.forEach(t=>{if(t.categoryId===id)t.categoryId=to;});state.budgets=state.budgets.filter(b=>b.categoryId!==id);state.categories=state.categories.filter(x=>x.id!==id);commit();toast('Deleted '+c.name);break;}
    case 'exportShare':exportShare();break;
    case 'exportNative':exportNative();break;
    case 'exportSave':exportSave();break;
    case 'exportCopy':exportCopy();break;
    case 'importPick':$('#importFile').value='';$('#importFile').click();break;
    case 'importPaste':$('#importArea').innerHTML='<label class="field"><span>Paste a Qirsh backup</span><textarea id="importTxt"></textarea></label><div class="btn-row"><button class="btn sm" data-act="importLoad">Check backup</button></div>';$('#importTxt').focus();break;
    case 'importLoad':stageImport($('#importTxt').value);break;
    case 'importConfirm':state=pendingImport;pendingImport=null;commit();toast('Backup imported: '+state.tx.length+' entries');break;
    case 'importCancel':pendingImport=null;render();break;
    case 'wipe':if(armed!=='wipe'){armed='wipe';render();break;}{armed=null;const keep={rate:state.rate,settings:state.settings,categories:state.categories};state=Object.assign(blankState(),keep);commit();toast('All data cleared');}break;
  }
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(sheetKind==='tx'&&form){
    if(t.dataset.line){const ln=(form[t.dataset.line]||[])[+t.dataset.i];if(ln)ln.v=t.value;if(t.dataset.line==='pay'&&t.dataset.i==='0')autoTo();updatePreview();}
    else if(t.id==='f-toamount'){form.toAmount=t.value;form.toTouched=true;if(form.type==='exchange')updatePreview();}
    else if(t.id==='f-xrate'){form.xrate=t.value;form.toTouched=false;autoTo();const ta=$('#f-toamount');if(ta)ta.value=form.toAmount;updatePreview();}
  }
  if(t.id==='hq'){hist.q=t.value;const m=hist.month,r={start:m,end:new Date(m.getFullYear(),m.getMonth()+1,1)};
    const q=hist.q.trim().toLowerCase();let txs=state.tx.filter(x=>inRange(x,r)&&(hist.filter==='all'||x.type===hist.filter));
    if(q)txs=txs.filter(x=>(x.note||'').toLowerCase().includes(q)||txTitle(x).toLowerCase().includes(q)||(String(x.amount)+' '+(x.amount2||'')).includes(q));
    txs.sort((a,b)=>b.date.localeCompare(a.date)||(b.createdAt||0)-(a.createdAt||0));$('#histList').innerHTML=historyList(txs);}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(sheetKind==='tx'&&(t.id==='f-from'||t.id==='f-to')){readForm();
    if(form.from===form.to){const pick=ACCOUNTS.find(a=>a.id!==t.value).id;if(t.id==='f-from')form.to=pick;else form.from=pick;}
    autoTo();drawSheet();return;}
  if(sheetKind==='tx'&&t.id==='f-acct'){readForm();updatePreview();return;}
  if(t.id==='rate'){const r=parseAmt(t.value);if(r>0){state.rate=r;commit();toast('Rate set to '+r.toLocaleString('en-US')+' LL');}else{t.value=state.rate.toLocaleString('en-US');toast('Enter a rate above zero.');}}
  if(t.dataset.open){const n=parseAmt(t.value);state.opening[t.dataset.open][t.dataset.cur]=isFinite(n)?n:0;commit();toast(accName(t.dataset.open)+' starting balance updated');}
  if(t.dataset.caticon){const c=catOf(t.dataset.caticon);if(c){const g=firstGlyph(t.value.trim());if(g)c.icon=g;else delete c.icon;commit();}}
  if(t.dataset.cat){const c=catOf(t.dataset.cat);if(c&&t.value.trim()){c.name=t.value.trim();save();}}
  if(t.id==='importFile'&&t.files&&t.files[0]){const r=new FileReader();r.onload=()=>stageImport(String(r.result));r.readAsText(t.files[0]);}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&sheetKind)closeSheet();if(e.key==='Enter'&&sheetKind&&e.target.tagName==='INPUT'){e.preventDefault();sheetKind==='tx'?saveTx():saveBudget();}});

let notesDl=null;
function updateNotesList(){if(!notesDl){notesDl=document.createElement('datalist');notesDl.id='notesList';document.body.appendChild(notesDl);}
  const seen=new Map();state.tx.forEach(t=>{const n=(t.note||'').trim();if(n)seen.set(n,(seen.get(n)||0)+1);});
  notesDl.innerHTML=[...seen.entries()].sort((a,b)=>b[1]-a[1]).slice(0,40).map(([n])=>'<option value="'+esc(n)+'"></option>').join('');}

window.__qirsh={get state(){return state},payVec,backVec,txCostUSD,normalize,balances,budgetStatus,templates,range,fmt,parseAmt,combinedUSD};
render();
syncNative();
})();
</script>
